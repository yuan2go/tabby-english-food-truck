name: engineering-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run resources
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/game.spec.ts e2e/m22-boundaries.spec.ts e2e/m22-growth.spec.ts e2e/m22-visible-walk.spec.ts e2e/m22-playability-visible.spec.ts e2e/minigames.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: test-results/
          retention-days: 7
